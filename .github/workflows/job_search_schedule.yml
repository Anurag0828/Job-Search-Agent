name: Scheduled AI Job Search Agent

on:
  schedule:
    # Runs at 8:00 AM IST (02:30 UTC) and 8:00 PM IST (14:30 UTC) every day
    - cron: '30 2,14 * * *'
  workflow_dispatch: # Enables manual "Run workflow" button in GitHub Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Unit Tests
        run: |
          pytest tests/ -v

      - name: Ingest Candidate Resume
        env:
          LLM_PROVIDER: nvidia
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3.5-bolt-e4b
          EMBEDDING_PROVIDER: nvidia
          NVIDIA_EMBED_MODEL: nvidia/nemotron-3-embed-1b
          PYTHONUNBUFFERED: "1"
        run: |
          python cli.py ingest --file "Anurag_Sajwan_Resume_Oct.pdf"
          python cli.py status

      - name: Restore Saved Login Session
        env:
          AUTH_JSON: ${{ secrets.AUTH_JSON }}
        run: |
          if [ -n "$AUTH_JSON" ]; then
            echo "$AUTH_JSON" > auth.json
            echo "auth.json restored successfully."
          else
            echo "No AUTH_JSON found, running in guest mode."
          fi

      - name: Execute Autonomous Job Search Pipeline
        env:
          LLM_PROVIDER: nvidia
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3.5-bolt-e4b
          EMBEDDING_PROVIDER: nvidia
          NVIDIA_EMBED_MODEL: nvidia/nemotron-3-embed-1b
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SMTP_HOST: smtp.gmail.com
          EMAIL_SMTP_PORT: 587
          SEARCH_QUERIES: Junior AI Engineer,AI Engineer
          SEARCH_LOCATIONS: India
          MIN_MATCH_SCORE: 65
          MAX_RECOMMENDATIONS: 10
          ENABLE_LINKEDIN_JOBS: "true"
          ENABLE_LINKEDIN_POSTS: "false"
          ENABLE_NAUKRI: "true"
          ENABLE_INDEED: "false"
          HEADLESS: "true"
          CI: "true"
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: INFO
        run: |
          python cli.py run-all
